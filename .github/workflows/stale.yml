# Deterministic stale policy. Fixed schedule, fixed thresholds, fixed exemptions.
name: Stale Bot

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 9am UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 14
          stale-issue-message: >
            This issue has been quiet for 30 days and is now marked stale.
            It will close in 14 days unless there's new activity.
            (Talent applications and security issues are never auto-closed.)
          stale-pr-message: >
            This PR has been quiet for 30 days and is now marked stale.
            It will close in 14 days unless there's new activity.
          exempt-issue-labels: 'pinned,security,talent-application'
          exempt-pr-labels: 'pinned,security'
          operations-per-run: 100
