name: "🐛 Bug Report"
description: "Something isn't working."
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened?"
      description: "What did you expect, and what did you get instead?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "Environment"
      placeholder: "e.g. Chrome 126 on Android, Python 3.12…"
    validations:
      required: false
