name: "💡 Feature Request"
description: "Suggest an idea for this project."
title: "[FEATURE] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "What problem would this solve? Who has it?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposal"
      description: "What should happen instead?"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
    validations:
      required: false
